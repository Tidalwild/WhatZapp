<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Synthetic button name and textbox name, not WhatsApp</title>
    <style>
      button, #box, [role="grid"] { display: block; width: 240px; min-height: 28px; }
      [role="row"], [role="gridcell"] { display: block; min-height: 18px; }
      .clip { display: block; width: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <p>TEST LAYOUT — button accessible name and textbox name. Not a WhatsApp DOM dump.</p>
    <button type="button" id="contact">
      <span class="clip"><span class="clip" aria-label="聯絡資料 contact-a"></span></span>
      contact-a
    </button>
    <div role="textbox" id="box" contenteditable="true">輸入要傳送去「contact-a 」嘅訊息</div>
    <div role="grid">
      <div role="row">
        <span>contact-a</span>
        <div role="gridcell" aria-label="secret-shape-gridcell">secret-shape-cell</div>
      </div>
    </div>
    <span>contact-a</span>
    <div aria-label="聯絡資料 contact-a extra secret-shape-longer"></div>
    <p>A+B Academy</p>
  </body>
</html>
